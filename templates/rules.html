{% extends "base.html" %}
{% block content %}
<section class="rules-workspace">
    <div class="rule-inventory-layout">
        <article class="panel rules-editor-panel">
            <div class="panel-header rules-panel-header">
                <h2 class="approvals-title">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 5h14v14H5z"></path>
                        <path d="M8 9h8M8 13h6M8 17h4"></path>
                    </svg>
                    <span>Suricata 룰 편집기</span>
                </h2>
                <div class="rule-edit-tools" id="rule-edit-tools" hidden>
                    <button id="copy-rule-record" class="button secondary small"
                        type="button" title="같은 내용, 새 SID로 새 룰">복사본</button>
                    <button id="new-rule-record" class="button secondary small"
                        type="button" title="수정 그만두고 새 룰">새 룰</button>
                </div>
            </div>
            <p class="rule-edit-mode" id="rule-edit-mode">새 룰 작성</p>

            <ol class="rule-steps" id="rule-steps" aria-label="룰 등록 순서">
                <li data-rule-step="write">작성</li>
                <li data-rule-step="validate">검증</li>
                <li data-rule-step="save">저장</li>
                <li data-rule-step="verify">검증기</li>
                <li data-rule-step="stage" title="승인 요청">승인</li>
            </ol>

            <form id="rule-form" class="stack-form rules-editor-form">
                <input id="rule-record-id" type="hidden">

                <div class="rule-target-grid">
                    <label>
                        <span>룰 이름</span>
                        <input id="rule-name" required
                            placeholder="예: 외부 SSH 무차별 대입 차단">
                    </label>
                    <label>
                        <span>호스트</span>
                        <input id="rule-host" list="rule-host-options" required
                            placeholder="예: 10.0.10.235">
                    </label>
                    <label>
                        <span>인터페이스</span>
                        <input id="rule-interface" list="rule-interface-options"
                            required placeholder="예: ens5">
                    </label>
                    <label>
                        <span>태그</span>
                        <input id="rule-tags"
                            placeholder="쉼표로 구분 (예: ssh, web)">
                    </label>
                </div>

                <label>
                    <span>설명</span>
                    <textarea id="rule-intent" rows="2"
                        placeholder="예: wp-login 접근 탐지"></textarea>
                </label>

                <label>
                    <span>룰 본문</span>
                    <textarea id="rule-text" class="code-input" rows="10">alert http any any -> $HOME_NET $HTTP_PORTS (msg:"HAW-KI example URI detection"; flow:established,to_server; http.uri; content:"/example-path"; sid:9900100; rev:1;)</textarea>
                    <small class="muted rule-verify-scope">검증기 지원: <code>http.uri</code> content 1개</small>
                </label>

                <label class="rule-enabled-control">
                    <input id="rule-enabled" type="checkbox" checked>
                    <span>사용 <small class="muted">(끄면 사용 중지 요청)</small></span>
                </label>

                <div id="rule-validation" class="validation-output empty-state">
                    문법 검증 전
                </div>

                <div class="button-row rules-editor-actions">
                    <button class="button ghost small" id="ask-rule-agent"
                        type="button">AI에게 검토 맡기</button>
                    <span class="rules-editor-spacer"></span>
                    <button class="button secondary" id="validate-rule"
                        type="button" data-rule-step-button="validate">문법 검증</button>
                    <button class="button secondary" id="save-rule-record"
                        type="submit" data-rule-step-button="save">저장</button>
                    <button class="button secondary" id="verify-rule-record"
                        type="button" data-rule-step-button="verify"
                        title="탐지·정상 트래픽 재현 시험">검증기 검사</button>
                    <button class="button secondary" id="stage-rule-record"
                        type="button" data-rule-step-button="stage">승인 요청</button>
                </div>
            </form>

            <datalist id="rule-host-options"></datalist>
            <datalist id="rule-interface-options"></datalist>
        </article>

        <article class="panel rules-inventory-panel">
            <div class="panel-header rules-panel-header">
                <h2 class="approvals-title">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <ellipse cx="12" cy="5" rx="7" ry="3"></ellipse>
                        <path d="M5 5v7c0 1.7 3.1 3 7 3s7-1.3 7-3V5"></path>
                        <path d="M5 12v7c0 1.7 3.1 3 7 3s7-1.3 7-3v-7"></path>
                    </svg>
                    <span>Suricata 룰 목록</span>
                </h2>
                <div class="approvals-header-tools">
                    <span id="rule-inventory-total"
                        class="approval-total-label">0개</span>
                    <button id="refresh-rule-inventory"
                        class="approval-refresh-button" type="button"
                        aria-label="룰 목록 새로고침"
                        title="룰 목록 새로고침">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 11a8 8 0 1 0-2.34 5.66"></path>
                            <path d="M20 4v7h-7"></path>
                        </svg>
                    </button>
                    {% if suricata_ui_url %}
                    <a class="approval-header-link"
                        href="{{ suricata_ui_url }}">Suricata UI</a>
                    {% endif %}
                </div>
            </div>

            <div id="rule-inventory-summary"
                class="rule-inventory-stats"></div>

            <form id="rule-inventory-filters"
                class="rule-inventory-filterbar rule-inventory-filterbar-compact">
                <label>
                    <span>검색</span>
                    <input id="rule-db-search" type="search"
                        placeholder="이름, SID, 호스트, 태그">
                </label>
                <label>
                    <span>상태</span>
                    <select id="rule-db-state">
                        <option value="">상태 전체</option>
                    </select>
                </label>
                <label>
                    <span>사용 여부</span>
                    <select id="rule-db-enabled">
                        <option value="">전체</option>
                        <option value="true">사용함</option>
                        <option value="false">사용 안 함</option>
                    </select>
                </label>
                <details class="filter-more">
                    <summary>필터 더 보기</summary>
                    <div class="filter-more-grid">
                        <label>
                            <span>호스트</span>
                            <select id="rule-db-host">
                                <option value="">호스트 전체</option>
                            </select>
                        </label>
                        <label>
                            <span>인터페이스</span>
                            <select id="rule-db-interface">
                                <option value="">인터페이스 전체</option>
                            </select>
                        </label>
                        <label>
                            <span>태그</span>
                            <select id="rule-db-tag">
                                <option value="">태그 전체</option>
                            </select>
                        </label>
                        <label>
                            <span>정렬</span>
                            <select id="rule-db-sort">
                                <option value="updated_desc">최근 수정순</option>
                                <option value="updated_asc">오래된 수정순</option>
                                <option value="host">호스트순</option>
                                <option value="interface">인터페이스순</option>
                                <option value="sid">SID순</option>
                                <option value="state">상태순</option>
                            </select>
                        </label>
                        <button id="clear-rule-db-filters"
                            class="button secondary small" type="button">초기화</button>
                    </div>
                </details>
            </form>

            <div class="approval-results-bar">
                <span id="rule-db-results">룰 목록을 불러오는 중…</span>
            </div>
            <div id="rule-database-list"
                class="rule-database-list loading-block">
                룰을 불러오는 중…
            </div>
        </article>
    </div>
</section>
{% endblock %}
