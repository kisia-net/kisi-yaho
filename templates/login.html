<!doctype html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HAW-KI · 로그인</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page" data-page="login">
    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="brand-mark">H</span>
                <div>
                    <p class="eyebrow">HAW-KI SOAR</p>
                    <h1>로그인</h1>
                </div>
            </div>

            <p>로그인하면 보안 경보, 에이전트 작업 화면, 계정별 대화 기록, 승인이 필요한 대응 조치를 이용할 수 있습니다.</p>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form class="auth-form" method="post" action="{{ url_for('login_page') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ next_path }}">

                <label>
                    아이디
                    <input name="username" autocomplete="username" required autofocus maxlength="32">
                </label>

                <label>
                    비밀번호
                    <input type="password" name="password" autocomplete="current-password" required maxlength="128">
                </label>

                <button class="button primary" type="submit">로그인</button>
            </form>
        </section>
        <p class="auth-footnote">기본 계정은 만들어지지 않습니다. 최초 관리자 계정은 환경변수로 설정합니다.</p>
    </main>
</body>
</html>
