<!doctype html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HAW-KI · 로그인</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <script src="{{ url_for('static', filename='theme-init.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/pretendard-1.3.9/pretendard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page" data-page="login">
    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="brand-mark">H</span>
                <div>
                    <p class="eyebrow">HAW-KI 보안 관제</p>
                    <h1>로그인</h1>
                </div>
            </div>

            

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form class="auth-form" method="post" action="{{ url_for('login_page') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ next_path }}">

                <label>
                    아이디
                    <input name="username" autocomplete="username" required autofocus maxlength="32">
                </label>

                <label>
                    비밀번호
                    <input type="password" name="password" autocomplete="current-password" required maxlength="128">
                </label>

                <button class="button primary" type="submit">로그인</button>
            </form>
        </section>
        
    </main>
</body>
</html>
