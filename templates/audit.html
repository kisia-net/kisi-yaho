{% extends "base.html" %}
{% block subtitle %}<p class="page-description">로그인, 검색, AI 요청, 룰·승인 기록 · 추가만 되고 수정·삭제되지 않음</p>{% endblock %}
{% block content %}
<section class="panel">
    <div class="panel-header"><div><h2>감사 이벤트</h2></div><button class="button secondary" id="refresh-audit" type="button">새로고침</button></div>
    <form class="toolbar-form audit-filter" id="audit-filter">
        <label>이벤트 종류
            <select id="audit-type"><option value="">전체</option></select>
        </label>
        <label>사용자
            <select id="audit-actor"><option value="">전체</option></select>
        </label>
        <label>내용 검색
            <input id="audit-q" placeholder="경보 ID, IP, 보고서 ID…" autocomplete="off">
        </label>
        <button class="button primary" type="submit">적용</button>
    </form>
    <div class="table-header"><span id="audit-count">—</span><label class="audit-quiet-toggle"><input type="checkbox" id="audit-show-quiet"> 추천 검색 건수 확인도 보기</label></div>
    <div id="audit-list" class="audit-list loading-block">감사 기록을 불러오는 중…</div>
</section>
{% endblock %}
