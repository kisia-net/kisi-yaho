{% extends "base.html" %}
{% block subtitle %}<p class="page-description">검색·에이전트 요청·룰 검증·승인 결정을 기록하는 로컬 감사 화면입니다. 기록은 덧붙이기만 되고 수정·삭제되지 않습니다.</p>{% endblock %}
{% block content %}
<section class="panel">
    <div class="panel-header"><div><p class="panel-kicker">추적성</p><h2>감사 이벤트</h2></div><button class="button secondary" id="refresh-audit" type="button">새로고침</button></div>
    <form class="toolbar-form audit-filter" id="audit-filter">
        <label>이벤트 종류
            <select id="audit-type"><option value="">전체</option></select>
        </label>
        <label>사용자
            <select id="audit-actor"><option value="">전체</option></select>
        </label>
        <label>내용 검색
            <input id="audit-q" placeholder="경보 ID, IP, 보고서 ID…" autocomplete="off">
        </label>
        <button class="button primary" type="submit">적용</button>
    </form>
    <div class="table-header"><span id="audit-count">—</span></div>
    <div id="audit-list" class="audit-list loading-block">감사 기록을 불러오는 중…</div>
</section>
{% endblock %}
