{% extends "base.html" %}
{% block subtitle %}<p class="page-description">레벨 8 이상 경보 중 우선순위가 높거나 위협 인텔리전스와 일치한 경보를 자동으로 분석한 보고서입니다. 모두 AI 초안이며, 분석가가 검토한 뒤에만 확인된 내용으로 봅니다.</p>{% endblock %}
{% block content %}
<div id="auto-report-root" data-csrf="{{ csrf_token() }}" data-role="{{ current_user.role if current_user else '' }}">

    <section class="metric-grid compact auto-report-metrics">
        <button class="metric-card metric-critical" type="button" data-quick-filter="review=unreviewed">
            <span>검토 전</span>
            <strong data-count="unreviewed">—</strong>
            <small>분석가 확인이 필요한 보고서</small>
        </button>
        <button class="metric-card metric-approval" type="button" data-quick-filter="ai=pending">
            <span>AI 분석 대기</span>
            <strong data-count="ai_pending">—</strong>
            <small>모델이 켜지면 자동으로 채워짐</small>
        </button>
        <button class="metric-card" type="button" data-quick-filter="band=P1">
            <span>P1 보고서</span>
            <strong data-count="p1">—</strong>
            <small>전체 <b data-count="total">—</b>건 중</small>
        </button>
        <div class="metric-card metric-neutral auto-report-worker">
            <span>자동 분석 작업기</span>
            <strong data-worker-state>—</strong>
            <small data-worker-detail>상태 확인 중…</small>
        </div>
    </section>

    <p class="policy-note auto-report-policy" data-policy>기준을 불러오는 중…</p>

    <div class="split-grid auto-report-grid">
        <section class="panel auto-report-list-panel">
            <form class="toolbar-form auto-report-filters" data-filters>
                <label>검색<input name="q" placeholder="호스트, IP, 룰, 보고서 ID"></label>
                <label>검토 상태
                    <select name="review">
                        <option value="all">전체</option>
                        <option value="unreviewed">검토 전</option>
                        <option value="investigating">추가 조사</option>
                        <option value="confirmed">확인됨</option>
                        <option value="false_positive">오탐</option>
                    </select>
                </label>
                <label>우선순위
                    <select name="band">
                        <option value="all">전체</option>
                        <option value="P1">P1</option>
                        <option value="P2">P2</option>
                        <option value="P3">P3</option>
                        <option value="P4">P4</option>
                    </select>
                </label>
                <label>AI 상태
                    <select name="ai">
                        <option value="all">전체</option>
                        <option value="completed">완료</option>
                        <option value="pending">대기</option>
                        <option value="failed">실패</option>
                        <option value="expired">만료</option>
                    </select>
                </label>
            </form>
            <div class="table-header">
                <span data-list-count>보고서를 불러오는 중…</span>
                <div>
                    <button class="button secondary small" type="button" data-refresh>새로고침</button>
                    <button class="button secondary small" type="button" data-run-now hidden>지금 한 번 실행</button>
                </div>
            </div>
            <div class="auto-report-list" data-list role="list"></div>
        </section>

        <section class="panel auto-report-detail-panel" aria-live="polite">
            <div class="auto-report-detail" data-detail>
                <div class="empty-state">왼쪽 목록에서 보고서를 고르세요.</div>
            </div>
        </section>
    </div>
</div>
<script src="{{ url_for('static', filename='auto_reports.js', v=asset_version) }}"></script>
{% endblock %}
