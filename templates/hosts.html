{% extends "base.html" %}

{% block subtitle %}
<p class="page-description">
    Wazuh가 관리하는 단말과 현재 운영 상태를 확인합니다.
</p>
{% endblock %}

{% block content %}
<section class="panel" id="hosts-root">
    <div class="panel-header">
        <div>
            <p class="panel-kicker">Wazuh Server API</p>
            <h2>관리 중인 호스트</h2>
        </div>

        <span class="muted" data-host-summary>
            불러오는 중…
        </span>
    </div>

    <div class="host-list" data-host-list>
        <div class="loading-block">
            Wazuh 에이전트를 불러오는 중…
        </div>
    </div>
</section>

<script src="{{ url_for('static', filename='hosts.js', v=asset_version) }}"></script>
{% endblock %}
