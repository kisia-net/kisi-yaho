{% extends "base.html" %}
{% block subtitle %}
<p class="page-description">
    Search Wazuh Indexer security data using read-only queries.
</p>
{% endblock %}

{% block content %}
<section class="panel">
    <form id="log-search-form" class="log-form">
        <label>
            Index pattern
            <input id="log-index" value="wazuh-alerts-*">
        </label>

        <input id="log-language" type="hidden" value="query_string">

        <label class="span-two">
            Query
            <input id="log-query" value="*">
        </label>

        <label>
            Start
            <input id="log-start" value="now-24h">
        </label>

        <label>
            End
            <input id="log-end" value="now">
        </label>

        <label>
            Maximum results
            <input id="log-size" type="number" min="1" max="200" value="50">
        </label>

        <button class="button primary" type="submit">
            Search
        </button>
    </form>

    <div class="policy-note" id="log-policy-note">
        Checking Wazuh Indexer search policy…
    </div>

    <div class="table-header">
        <span id="log-count">No search performed yet</span>

        <div>
            <button class="button ghost" id="copy-log-query" type="button">
                Copy query
            </button>

            <a class="button secondary"
               id="open-wazuh-link"
               href="{{ wazuh_dashboard_url }}"
               target="_blank"
               rel="noopener noreferrer">
                Open Wazuh Dashboard ↗
            </a>
        </div>
    </div>

    <div class="log-results" id="log-results">
        <div class="empty-state">
            Search results will appear here.
        </div>
    </div>
</section>
{% endblock %}
