{% extends "base.html" %}
{% block subtitle %}<p class="page-description">정밀 분석은 Kibana에서 하는 것을 기본으로 하고, 이 화면은 안전한 바로가기와 읽기 전용 검색만 제공합니다.</p>{% endblock %}
{% block content %}
<section class="panel">
    <form id="log-search-form" class="log-form">
        <label>인덱스 패턴<input id="log-index" value="logs-*"></label>
        <label>질의 방식<select id="log-language"><option value="kql">KQL · Kibana 링크</option><option value="query_string">Elasticsearch 질의문</option></select></label>
        <label class="span-two">질의 (Query)<input id="log-query" value="event.category:authentication and event.outcome:failure"></label>
        <label>시작<input id="log-start" value="now-24h"></label>
        <label>끝<input id="log-end" value="now"></label>
        <label>최대 건수<input id="log-size" type="number" min="1" max="200" value="50"></label>
        <button class="button primary" type="submit">검색 실행</button>
    </form>
    <div class="policy-note" id="log-policy-note">Elasticsearch 검색 정책을 확인하는 중…</div>
    <div class="table-header"><span id="log-count">아직 검색하지 않음</span><div><button class="button ghost" id="copy-log-query" type="button">질의 복사</button><a class="button secondary" id="open-kibana-link" href="{{ kibana_url }}/app/discover" target="_blank" rel="noopener noreferrer">Kibana 열기 ↗</a></div></div>
    <div class="log-results" id="log-results"><div class="empty-state">검색 결과가 여기에 표시됩니다.</div></div>
</section>
{% endblock %}
