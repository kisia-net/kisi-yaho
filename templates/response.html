{% extends "base.html" %}
{% block subtitle %}<p class="page-description">Velociraptor 클라이언트와 기존 수집 결과, 대응 상태를 확인합니다.</p>{% endblock %}
{% block content %}
<section class="workflow-stack response-workflow">
    <article class="panel">
<div class="panel-header proposal-toolbar"><a class="button secondary" href="{{ velociraptor_url }}" target="_blank" rel="noopener noreferrer">Velociraptor 열기 ↗</a></div>
        <details class="secondary-workflow">
    <summary>호스트 대응 제안 (선택 사항)</summary>
    <div class="secondary-workflow-body">
<form class="stack-form" id="response-agent-form">
            <label>대상 호스트<select id="response-host" required disabled><option value="">클라이언트를 불러오는 중…</option></select></label>
            <label>사건 번호<input id="response-incident" placeholder="INC-2026-1042"></label>
            <label>원하는 결과<select id="response-outcome"><option>단말 초동 증거 수집</option><option>수집 후 호스트 격리</option><option>검증된 지속성 수단 제거</option><option>네트워크 접속 복구</option></select></label>
            <label>확인된 증거<textarea id="response-evidence" rows="6" placeholder="확인된 프로세스, 사용자, 해시, 목적지, 시간 흐름, 업무상 제약…"></textarea></label>
            <button class="button primary" type="submit">대응 제안 작성</button>
        </form>
    </div>
</details>
    </article>
    <article class="panel">
        <div class="panel-header"><div><p class="panel-kicker">승인 상태</p><h2>Velociraptor 조치 대기열</h2></div><a class="button secondary" href="/actions">승인 전체 보기</a></div>
        
        <h3>선택 클라이언트의 기존 수집</h3>
        <div id="response-flow-list" class="hunt-list loading-block">
            클라이언트를 선택하면 기존 수집 결과를 조회합니다…
        </div>
        <div id="response-action-list" class="action-list loading-block">조치를 불러오는 중…</div>
    </article>
</section>
{% endblock %}
