{% extends "base.html" %}

{% block subtitle %}
<p class="page-description">
    선택한 Wazuh 탐지와 원본 증거를 확인합니다.
</p>
{% endblock %}

{% block content %}
<div id="alert-analysis-root"
     data-alert-id="{{ alert_id }}"
     data-csrf="{{ csrf_token() }}">

    <section class="panel">
        <div class="panel-header">
            <div>
                <p class="panel-kicker">Wazuh 경보</p>
                <h2 data-case-title>경보를 불러오는 중…</h2>
                <p class="muted" data-case-id hidden></p>
            </div>

            <div class="button-row">
                <button class="button primary"
                        type="button"
                        data-analyze>
                    LLM으로 분석
                </button>

                <a class="button secondary"
                   href="/agent?mode=alert_summary"
                   data-continue-agent>
                    AI 분석 작업공간에서 이어가기
                </a>
            </div>
        </div>
        <div class="alert-history" data-alert-history hidden></div>
        <div class="structured-output history-redteam" data-history-redteam hidden></div>
    </section>

    <section class="panel">
        <div class="panel-header">
            <div>
                <p class="panel-kicker">관측된 탐지</p>
                <h2>탐지 증거</h2>
            </div>
        </div>

        <div class="structured-output" data-trigger></div>
    </section>

    <section class="panel"
             data-enrichment-section
             hidden>
        <div class="panel-header">
            <div>
                <p class="panel-kicker">규칙 기반 맥락</p>
                <h2>분석가 참고 정보</h2>
            </div>

            <span class="muted">
                경보 전후 24시간 이력
            </span>
        </div>

        <div class="analyst-context-grid"
             data-analyst-context>
        </div>
    </section>

    <section class="panel"
             data-pivots-section
             hidden>
        <div class="panel-header">
            <div>
                <p class="panel-kicker">규칙 기반 조사</p>
                <h2>조사 바로가기</h2>
            </div>
        </div>

        <div class="button-row investigation-pivots"
             data-investigation-pivots>
        </div>
    </section>

    <!--
      Compatibility targets for the current case renderer.
      These are intentionally not presented until they are backed
      by real live correlation/enrichment sources.
    -->
    <section class="panel">
        <div class="panel-header">
            <div>
                <p class="panel-kicker">연관 증거</p>
                <h2>조사 맥락</h2>
            </div>

            <span class="muted" data-context-meta></span>
        </div>

        <div class="structured-output"
             data-investigation-context>
            <div class="empty-state">
                관련 증거를 불러오는 중…
            </div>
        </div>
    </section>


    <div hidden aria-hidden="true">
        <div data-entities></div>
        <div data-assets></div>
        <div data-intel></div>
        <div data-timeline></div>
    </div>

    <section class="panel" data-analysis-section hidden>
        <div class="panel-header">
            <div>
                <p class="panel-kicker">LLM 분석</p>
                <h2>판단 결과</h2>
            </div>

            <span class="muted" data-analysis-meta></span>
        </div>

        <div class="structured-output"
             data-analysis-output></div>

        <div class="structured-output"
             data-analysis-review
             hidden></div>

        <div class="structured-output"
             data-analysis-xai
             hidden></div>

        <div class="structured-output"
             data-analysis-redteam
             hidden></div>

        <div class="structured-output"
             data-analyst-feedback
             hidden></div>
    </section>
</div>

<script src="{{ url_for('static', filename='xai.js', v=asset_version) }}"></script>
<script src="{{ url_for('static', filename='redteam.js', v=asset_version) }}"></script>
<script src="{{ url_for('static', filename='alert_analysis.js', v=asset_version) }}"></script>
{% endblock %}
