{% extends "base.html" %}
{% block subtitle %}
<p class="page-description">
    Review Wazuh security alerts, correlated evidence, and investigation context.
</p>
{% endblock %}

{% block content %}
<section class="panel">
    <form id="alert-filter-form" class="toolbar-form">
        <label>
            Search
            <input id="alert-query" placeholder="Agent, IP, rule, group, MITRE, or detection">
        </label>

        <label>
            Minimum Wazuh level
            <select id="alert-min-level">
                <option value="0">All levels</option>
                <option value="3">Level 3+</option>
                <option value="5">Level 5+</option>
                <option value="8">Level 8+</option>
                <option value="10">Level 10+</option>
                <option value="12">Level 12+</option>
            </select>
        </label>

        <button class="button primary" type="submit">
            Apply filters
        </button>
    </form>

    <div class="table-header">
        <span id="alert-count">Loading alerts…</span>
        <a class="button secondary" href="/agent?mode=alert_summary">
            Open agent
        </a>
    </div>

    <div class="data-table" id="alerts-table"></div>
</section>
{% endblock %}
