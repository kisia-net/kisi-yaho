# =============================================================================
# portal.conf — 공격 대상 웹 서버 (web / 10.0.1.201)
# =============================================================================
#
#  /etc/nginx/sites-available/portal 로 복사하고 sites-enabled 에 링크합니다.
#  default 사이트는 반드시 지우십시오. 두 개가 같이 listen 하면
#  어느 쪽이 응답했는지 로그로 구분이 안 됩니다.
#
#  ★ 로그 포맷을 바꾸지 마십시오 ★
#    hawki_alert_analysis/adapters.py:219 의 NGINX_COMBINED 정규식은
#    combined 형식에 정확히 고정(^...$)되어 있습니다.
#    $request_time 하나만 덧붙여도 ingest 가 그 줄을 통째로 버립니다.
#    추가 필드가 필요하면 access.log 를 건드리지 말고 별도 로그를 하나 더 만드세요.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name portal.example.local _;

    root  /var/www/kisiyaho;
    index index.php;

    # 파이프라인이 읽는 파일. 형식은 nginx 기본 combined 그대로입니다.
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # 사람이 볼 용도의 확장 로그. 이쪽은 마음대로 필드를 늘려도 됩니다.
    access_log /var/log/nginx/access_extended.log extended;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # 시나리오 로그에 나오는 /portal/login 을 그대로 살립니다.
    location = /portal/login {
        rewrite ^ /portal/login.php last;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    # 서버 안쪽을 그대로 노출하는 파일은 웹으로 내보내지 않습니다.
    location ~ /\.(?!well-known) { deny all; }
}
