# =============================================================================
# main.conf — nginx 가 읽는 ModSecurity 진입점 (/etc/nginx/modsec/main.conf)
# =============================================================================
#
#  읽는 순서가 곧 우선순위입니다. 뒤에 온 설정이 앞을 덮습니다.
#
#    1. modsecurity.conf   업스트림 권장본. 손대지 않습니다.
#    2. overrides.conf     우리가 바꾸는 것만. 손댈 곳은 여기 하나입니다.
#    3. crs-setup.conf     CRS 자체 설정 (paranoia level 등)
#    4. rules/*.conf       CRS 룰 본문
#
#  업스트림 권장본을 직접 고치면 CRS 를 올릴 때마다 충돌합니다.
#  "무엇을 우리가 바꿨는가" 가 overrides.conf 한 파일에 모여 있어야
#  나중에 "이 설정 누가 왜 넣었냐" 에 답할 수 있습니다.

Include /etc/nginx/modsec/modsecurity.conf
Include /etc/nginx/modsec/overrides.conf
Include /etc/nginx/modsec/coreruleset/crs-setup.conf
Include /etc/nginx/modsec/coreruleset/rules/*.conf
