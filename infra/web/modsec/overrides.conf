# =============================================================================
# overrides.conf — 우리가 업스트림 권장본에서 바꾼 것 전부
# =============================================================================
#
#  파이프라인(hawki_alert_analysis/adapters.py:503 ModSecurityAdapter)이
#  읽을 수 있는 형식으로 감사 로그를 뽑는 것이 이 파일의 목적입니다.
#  아래 네 줄이 특히 중요하고, 하나라도 틀리면 ingest 가 로그를 못 읽습니다.
#
#    SecAuditLogFormat JSON     ← 텍스트(Native)면 어댑터가 못 읽습니다
#    SecAuditLogType Serial     ← Concurrent 는 트랜잭션마다 파일을 쪼갭니다
#    SecAuditLog <파일 하나>     ← 어댑터는 "한 줄에 JSON 하나" 를 기대합니다
#    SecAuditLogParts ...C...   ← C 가 빠지면 payload(요청 본문)가 0건이 됩니다

# --- 엔진 --------------------------------------------------------------------
#
#  DetectionOnly = 탐지만 하고 통과시킴  → 웹서버가 200 을 돌려줌
#  On            = 탐지하고 차단함        → 웹서버가 403 을 돌려줌
#
#  경보 룰 3번(WAF 탐지 + 웹서버 200 상관분석)은 이 두 모드를 번갈아 켜야
#  "통과한 경우" 와 "막힌 경우" 가 같은 데이터셋 안에 함께 생깁니다.
#  기본값은 차단입니다. 통과 사례를 만들 때만 잠깐 DetectionOnly 로 내립니다.
SecRuleEngine On

# --- 요청 본문 = payload ------------------------------------------------------
#
#  ③번(로그 수집) 쪽에서 "Suricata payload 가 0건" 이 문제가 됐는데,
#  웹 구간에서 같은 역할을 하는 것이 이 두 줄입니다.
#  이걸 안 켜면 POST 로 들어온 SQLi 문자열이 로그 어디에도 남지 않습니다.
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# 응답 본문은 CRS 의 유출 탐지 룰(94x/95x)이 씁니다.
# 전부 켜면 로그가 급격히 커지므로 텍스트 계열만 봅니다.
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# --- 감사 로그 ----------------------------------------------------------------
#
#  RelevantOnly = 룰에 걸린 트랜잭션만 기록.
#  공격 재현 구간에서는 On 으로 올려서 "아무 룰도 안 걸린 정상 요청" 까지
#  같이 받아두십시오. 어댑터는 그것을 alert 가 아닌 event 로 정규화하고,
#  상관분석의 배경(정상 대비 이상)이 되는 것이 그 event 들입니다.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"

# A 헤더 · B 요청헤더 · C 요청본문(payload) · E 응답본문
# F 응답헤더 · H 트레일러(룰 메시지) · J 업로드파일정보 · K 매칭룰 · Z 종료
SecAuditLogParts ABCEFHJKZ

SecAuditLogType   Serial
SecAuditLogFormat JSON
SecAuditLog       /var/log/modsec_audit.json
SecAuditLogFileMode 0640

# --- 그 밖 --------------------------------------------------------------------
SecStatusEngine Off
SecDebugLog /var/log/modsec_debug.log
SecDebugLogLevel 0
