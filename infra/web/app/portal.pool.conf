; =============================================================================
; portal.pool.conf — PHP-FPM 풀 (/etc/php/8.1/fpm/pool.d/portal.conf)
; =============================================================================
;
;  open_basedir 가 이 실습의 봉쇄선입니다.
;  index.php 의 LFI 는 일부러 살려두되, 나갈 수 있는 범위를 여기서 묶습니다.
;
;    /var/www/kisiyaho        앱 본체
;    /var/www/kisiyaho-decoy  미끼 트리 (여기로 가는 traversal 만 200)
;    /var/www/kisiyaho-data   SQLite 더미 계정 DB
;
;  이 밖으로 나가는 ../../../../etc/passwd 는 404 가 됩니다.
;  그 404 도 버리지 마십시오 — "탐지됐고 막혔다" 쪽 사례로 씁니다.

[portal]
user  = www-data
group = www-data
listen = /run/php/php8.1-fpm.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

php_admin_value[open_basedir] = /var/www/kisiyaho:/var/www/kisiyaho-decoy:/var/www/kisiyaho-data
php_admin_value[error_log] = /var/log/php-portal-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[expose_php] = 0
