{
  "name": "hawki",
  "services": {
    "hawki-web": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile"
      },
      "container_name": "hawki-web",
      "restart": "unless-stopped",
      "env_file": [
        ".env"
      ],
      "environment": {
        "VELOCIRAPTOR_URL": "/velociraptor/app/index.html",
        "VELOCIRAPTOR_API_CONFIG": "/run/secrets/hawki-readonly.api.yaml",
        "LLM_API_URL": "${LLM_API_URL:-http://vllm:8000/v1/chat/completions}",
        "LLM_MODEL": "${VLLM_SERVED_MODEL:-hawki-local}",
        "LLM_API_KEY": "${VLLM_API_KEY}",
        "HAWKI_VR_DB": "/app/data/velociraptor/workspace.sqlite3"
      },
      "ports": [
        "5000:5000"
      ],
      "volumes": [
        "/etc/hawki/velociraptor/hawki-readonly.api.yaml:/run/secrets/hawki-readonly.api.yaml:ro",
        "hawki-data:/app/data",
        "./data/scenarios:/app/data/scenarios:ro",
        "./data/assets:/app/data/assets:ro",
        "./data/assets-live:/app/data/assets-live:ro",
        "./data/threat_intel:/app/data/threat_intel:ro",
        "./data/threat_intel-live:/app/data/threat_intel-live:ro"
      ],
      "extra_hosts": [
        "host.docker.internal:host-gateway",
        "wazuh.indexer:10.0.10.123",
        "wazuh.dashboard:10.0.10.123"
      ],
      "networks": [
        "hawki"
      ],
      "image": "hawki-vr-workspace:2026.10.06.1"
    },
    "hawki-worker": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile"
      },
      "container_name": "hawki-worker",
      "restart": "unless-stopped",
      "command": [
        "flask",
        "--app",
        "app",
        "auto-report"
      ],
      "env_file": [
        ".env"
      ],
      "environment": {
        "LLM_API_URL": "${LLM_API_URL:-http://vllm:8000/v1/chat/completions}",
        "LLM_MODEL": "${VLLM_SERVED_MODEL:-hawki-local}",
        "LLM_API_KEY": "${VLLM_API_KEY}"
      },
      "volumes": [
        "hawki-data:/app/data",
        "./data/scenarios:/app/data/scenarios:ro",
        "./data/assets:/app/data/assets:ro",
        "./data/assets-live:/app/data/assets-live:ro",
        "./data/threat_intel:/app/data/threat_intel:ro",
        "./data/threat_intel-live:/app/data/threat_intel-live:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import json,os,sys,datetime as d;s=json.load(open('/app/data/auto_reports/state.json'));t=d.datetime.fromisoformat(s.get('heartbeat_at') or s['last_cycle_at']);sys.exit(0 if (d.datetime.now(d.timezone.utc)-t).total_seconds()<max(900,3*int(os.getenv('AUTO_ANALYSIS_POLL_SECONDS','60'))) else 1)"
        ],
        "interval": "60s",
        "timeout": "5s",
        "start_period": "90s",
        "retries": 3
      },
      "extra_hosts": [
        "host.docker.internal:host-gateway",
        "wazuh.indexer:10.0.10.123",
        "wazuh.dashboard:10.0.10.123"
      ],
      "networks": [
        "hawki"
      ]
    },
    "suricata": {
      "image": "jasonish/suricata:latest",
      "container_name": "hawki-suricata",
      "profiles": [
        "capture"
      ],
      "restart": "no",
      "volumes": [
        "./capture/pcap:/capture:ro",
        "./capture/out:/var/log/suricata",
        "hawki-suricata-rules:/var/lib/suricata"
      ],
      "command": [
        "-r",
        "/capture/${PCAP_FILE:-capture.pcap}",
        "-l",
        "/var/log/suricata",
        "-v"
      ],
      "networks": [
        "hawki"
      ]
    },
    "suricata-update": {
      "image": "jasonish/suricata:latest",
      "container_name": "hawki-suricata-update",
      "profiles": [
        "rules"
      ],
      "restart": "no",
      "entrypoint": [
        "suricata-update"
      ],
      "volumes": [
        "hawki-suricata-rules:/var/lib/suricata"
      ],
      "networks": [
        "hawki"
      ]
    },
    "vllm": {
      "image": "vllm/vllm-openai:latest",
      "container_name": "hawki-vllm",
      "profiles": [
        "llm"
      ],
      "restart": "unless-stopped",
      "gpus": "all",
      "ipc": "host",
      "environment": {
        "CUDA_VISIBLE_DEVICES": "${CUDA_VISIBLE_DEVICES:-0}"
      },
      "volumes": [
        "hawki-hf-cache:/root/.cache/huggingface",
        "hawki-vllm-cache:/root/.cache/vllm"
      ],
      "expose": [
        "8000"
      ],
      "ports": [
        "127.0.0.1:8000:8000"
      ],
      "command": [
        "--model",
        "${VLLM_MODEL:-openai/gpt-oss-20b}",
        "--served-model-name",
        "${VLLM_SERVED_MODEL:-hawki-local}",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--api-key",
        "${VLLM_API_KEY}",
        "--gpu-memory-utilization",
        "${VLLM_GPU_MEMORY_UTILIZATION:-0.88}",
        "--max-model-len",
        "${VLLM_MAX_MODEL_LEN:-32768}",
        "--max-num-seqs",
        "${VLLM_MAX_NUM_SEQS:-4}",
        "--enable-auto-tool-choice",
        "--tool-call-parser",
        "openai",
        "--reasoning-parser",
        "openai_gptoss",
        "--enable-prefix-caching"
      ],
      "networks": [
        "hawki"
      ]
    },
    "vr-dispatcher": {
      "image": "hawki-vr-workspace:2026.10.06.1",
      "restart": "unless-stopped",
      "command": [
        "python",
        "-m",
        "hawki_vr.worker"
      ],
      "environment": {
        "HAWKI_VR_DB": "/app/data/velociraptor/workspace.sqlite3",
        "VELOCIRAPTOR_EXEC_API_CONFIG": "/run/vr-execution/api.yaml",
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONUNBUFFERED": "1"
      },
      "volumes": [
        "hawki-data:/app/data",
        {
          "type": "bind",
          "source": "/opt/hawki/secrets/velociraptor-execution",
          "target": "/run/vr-execution",
          "read_only": true
        }
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "from hawki_vr.store import Store; import sys; sys.exit(0 if Store().health()['ready'] else 1)"
        ],
        "interval": "30s",
        "timeout": "5s",
        "retries": 3
      },
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "384m",
      "cpus": 0.5,
      "networks": [
        "hawki"
      ],
      "extra_hosts": [
        "host.docker.internal:host-gateway",
        "wazuh.indexer:10.0.10.123",
        "wazuh.dashboard:10.0.10.123"
      ]
    }
  },
  "networks": {
    "hawki": {
      "name": "hawki-network"
    }
  },
  "volumes": {
    "hawki-data": null,
    "hawki-hf-cache": null,
    "hawki-vllm-cache": null,
    "hawki-suricata-rules": null
  }
}
